services:
  # Backend Web Service (FastAPI + AI Models via Docker)
  - type: web
    name: pothole-detection-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000

  # Frontend Static Site (React + Vite)
  - type: web
    name: pothole-detection-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pothole-detection-backend
          property: url
